spring.application.name=freelance-collab-platform
spring.datasource.url=jdbc:h2:mem:freelance;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
server.servlet.session.tracking-modes=cookie

# 파일 저장소(FileStorage) 위치
app.file-storage.root=./data/files
# 외부 서비스 Mock 실패 흉내 (시연·시험용)
mock.notification.always-fail=false
mock.payment.always-fail=false
# 시연용 계정과 프로젝트를 넣을지
app.seed-demo-data=true

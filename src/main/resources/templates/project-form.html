<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('프로젝트 등록')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>프로젝트 등록</h1>
    <div class="msg err" th:if="${error}" th:text="${error}"></div>
    <form class="box" th:action="@{/projects}" method="post">
        <label>제목</label><input type="text" name="title" required>
        <label>작업 분야</label><input type="text" name="field" placeholder="예: 디자인">
        <label>작업 내용</label><textarea name="description" required></textarea>
        <label>기대 결과물 (파일 형식을 쉼표로, 예: png, pdf)</label><input type="text" name="expectedOutput">
        <div class="row">
            <div><label>예산 하한(원)</label><input type="number" name="budgetMin" min="0" value="0" required></div>
            <div><label>예산 상한(원)</label><input type="number" name="budgetMax" min="0" value="0" required></div>
            <div><label>희망 마감일</label><input type="date" name="dueDate" required></div>
        </div>
        <button class="primary" type="submit">등록</button>
    </form>
</main>
</body>
</html>

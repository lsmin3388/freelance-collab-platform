<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('내 프로젝트·제안')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>내 프로젝트·제안</h1>
    <h2>내가 등록한 프로젝트</h2>
    <table>
        <tr><th>제목</th><th>상태</th><th>희망 마감일</th></tr>
        <tr th:each="p : ${myProjects}">
            <td><a th:href="@{/projects/{id}(id=${p.id()})}" th:text="${p.title()}"></a></td>
            <td><span class="state" th:text="${p.stateLabel()}"></span></td>
            <td th:text="${p.dueDate()}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(myProjects)}"><td colspan="3" class="muted">없음</td></tr>
    </table>
    <h2>내가 낸 제안</h2>
    <table>
        <tr><th>프로젝트</th><th>금액</th><th>기간</th><th>제안 상태</th><th>프로젝트 상태</th></tr>
        <tr th:each="m : ${myProposals}">
            <td><a th:href="@{/projects/{id}(id=${m.projectId()})}" th:text="${m.projectTitle()}"></a></td>
            <td th:text="${#numbers.formatInteger(m.amount(), 0, 'COMMA')} + '원'"></td>
            <td th:text="${m.durationDays()} + '일'"></td>
            <td><span class="state" th:text="${m.stateLabel()}"></span></td>
            <td th:text="${m.projectStateLabel()}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(myProposals)}"><td colspan="5" class="muted">없음</td></tr>
    </table>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('제안 목록')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main th:with="p=${page.project()}">
    <h1 th:text="${p.title()} + ' · 제안 목록'">제안 목록</h1>
    <nav th:replace="~{fragments :: tabs(${p})}"></nav>
    <div th:replace="~{fragments :: messages}"></div>
    <p>프로젝트 상태 <span class="state" th:text="${p.stateLabel()}"></span>
        <span class="muted" th:if="${p.state().name() != 'RECRUITING'}"> · 모집 중일 때만 선정할 수 있습니다.</span></p>
    <form method="get" class="muted">정렬
        <select name="sort" onchange="this.form.submit()" style="width:auto">
            <option th:each="s : ${sorts}" th:value="${s.name()}" th:text="${s.label()}" th:selected="${s == page.sort()}"></option>
        </select>
    </form>
    <p th:if="${#lists.isEmpty(page.rows())}" class="box muted">아직 접수된 제안이 없습니다.</p>
    <table th:unless="${#lists.isEmpty(page.rows())}">
        <tr><th>프리랜서</th><th>금액</th><th>기간</th><th>제안 내용</th><th>상태</th><th></th></tr>
        <tr th:each="r : ${page.rows()}">
            <td><span th:text="${r.freelancerName()}"></span><br>
                <span class="muted" th:text="${r.expertise()} + ' · 경력 ' + ${r.careerYears()} + '년'"></span></td>
            <td th:text="${#numbers.formatInteger(r.amount(), 0, 'COMMA')} + '원'"></td>
            <td th:text="${r.durationDays()} + '일'"></td>
            <td th:text="${r.content()}"></td>
            <td><span class="state" th:text="${r.stateLabel()}"></span></td>
            <td>
                <form th:if="${r.selectable()}" method="post"
                      th:action="@{/projects/{pid}/proposals/{id}/select(pid=${p.id()},id=${r.id()})}"
                      onsubmit="return confirm('이 제안을 선정할까요? 선정하면 작업 조건 합의로 넘어갑니다.')">
                    <button class="primary" type="submit" style="margin:0">선정</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>

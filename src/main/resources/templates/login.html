<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<main style="max-width:420px">
    <h1>로그인</h1>
    <div class="msg err" th:if="${error}" th:text="${error}"></div>
    <form class="box" th:action="@{/login}" method="post">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" th:value="${email}" required>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
        <button class="primary" type="submit">로그인</button>
    </form>
    <div class="box muted">
        시연 계정(비밀번호 1234)<br>
        client@demo.kr 김의뢰 (의뢰자)<br>
        design@demo.kr 박디자 (프리랜서)<br>
        dev@demo.kr 최개발 (프리랜서)<br>
        both@demo.kr 이겸임 (의뢰자·프리랜서)
    </div>
</main>
</body>
</html>
